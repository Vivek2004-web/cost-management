name: CI/CD AWS Cloud Cost Monitor Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test & Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install & Verify Backend
        run: |
          cd backend
          npm ci
          npm test || true

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Docker Container Images
        run: |
          docker compose build

  deploy-to-ec2:
    name: Deploy to AWS EC2 Instance
    needs: test-and-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/aws-cloud-cost-monitor || git clone https://github.com/${{ github.repository }}.git /home/ubuntu/aws-cloud-cost-monitor
            cd /home/ubuntu/aws-cloud-cost-monitor
            git pull origin main
            chmod +x scripts/deploy-ec2.sh
            ./scripts/deploy-ec2.sh
